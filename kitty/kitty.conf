# vim:ft=kitty

# Color palette matching waybar theme
# Derived from vibrant red/orange waves, teal blue, magenta wallpaper

# The basic colors
foreground              #E0E4EC
background              #141929
selection_foreground    #141929
selection_background    #E0E4EC

# Cursor colors
cursor                  #E0E4EC
cursor_text_color       #141929

# URL underline color when hovering with mouse
url_color               #5EC4D4

# Kitty window border colors
active_border_color     #E8364F
inactive_border_color   #4A4E5D
bell_border_color       #F9C846

# Tab bar colors
active_tab_foreground   #141929
active_tab_background   #E8364F
inactive_tab_foreground #C8CCD4
inactive_tab_background #2A2E3D
tab_bar_background      #141929

# Colors for marks
mark1_foreground #141929
mark1_background #E8364F
mark2_foreground #141929
mark2_background #F28A2E
mark3_foreground #141929
mark3_background #5EC4D4

# The 16 terminal colors

# black
color0 #2A2E3D
color8 #4A4E5D

# red
color1 #E8364F
color9 #FF4D63

# green (using cyan from palette for green slot)
color2  #5EC4D4
color10 #7ED4E0

# yellow
color3  #F9C846
color11 #FFD866

# blue
color4  #4A90D9
color12 #6AABF0

# magenta
color5  #A8245E
color13 #C43878

# cyan
color6  #5EC4D4
color14 #7ED4E0

# white
color7  #C8CCD4
color15 #D8DCE4

# Font size
font_size 12.0

# Line height (extra vertical spacing)
modify_font cell_height 1px

# Semi-transparent background (matches waybar's blurred look)
background_opacity 0.9
background_blur 1

# Padding inside the window
window_padding_width 12

# Custom keybindings
# Shift+Enter is intentionally left unmapped so Kitty/Herdr/Pi can use the native keyboard protocol.
include themes/noctalia.conf
